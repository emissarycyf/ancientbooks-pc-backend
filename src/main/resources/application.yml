server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ancientbooks-analyse-pc-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/ancient_books_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    # ⚠️ 安全警告：生产环境请使用环境变量或配置中心
    # 例如：${DB_PASSWORD:default_password}
    password: cyf12345
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ancientbooks.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Coze 扣子配置
# ⚠️ 安全警告：生产环境请使用环境变量或配置中心
coze:
  # V3 API 地址
  base-url-v3: https://api.coze.cn/v3/chat
  # V2 API 地址（保留兼容）
  base-url-v2: https://api.coze.cn/open_api/v2/chat
  # 当前使用的API版本：v3 或 v2
  api-version: v3
  # 请替换为真实的 PAT Token
  pat-token: "pat_nL5I7vgfXWMxgnILtCgJA2kItddRMikkudj4yaXqCt14AMtkMlZWcuzBTlV7Z5Xj"
  # 请替换为真实的 Bot ID
  bot-id: "7682050173660758056"
  # 工作流ID（用于工作流调用）
  workflow-id: ""
  # 超时时间（毫秒）
  timeout: 180000

# 日志
logging:
  level:
    com.ancientbooks.mapper: debug

# JWT 配置
jwt:
  secret: "your-256-bit-secret-key-change-in-production-12345678901234567890123456789012"
  expiration: 86400000  # 24小时（毫秒）
  blacklist-prefix: "jwt:blacklist:"

# 限流配置
rate-limit:
  enabled: true
  max-requests: 30  # 每分钟最大请求数
  window-seconds: 60
  prefix: "rate:limit:"
